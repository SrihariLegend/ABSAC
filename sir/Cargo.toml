[workspace]
resolver = "2"
members = [
    "crates/sir_types",
    "crates/sir_nodes",
    "crates/sir_builder",
    "crates/sir_verify",
    "crates/sir_analysis",
    "crates/sir_opt", "crates/sir_benchmarks", "crates/sir_lower",
    "crates/sir_mech",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Srihari <srihari@example.com>"]

# Tests are overwhelmingly solver time; optimizing dev/test builds keeps the
# single-digit suite fast enough to run on every edit.
[profile.dev]
opt-level = 3

[profile.test]
opt-level = 3
